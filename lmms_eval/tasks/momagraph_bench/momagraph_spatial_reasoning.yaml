# MomaGraph-Bench · Spatial Reasoning
#
# 具身智能 VLM 评测 —— 空间推理。来自 能力体系（CAPABILITIES.md） 的 P0 条目 #30。
# 论文/代码：https://github.com/HybridRobotics/MomaGraph
# 数据：https://huggingface.co/datasets/cheryyunl/MomaGraph-Bench
#
# 筛选：type == "Spatial Reasoning"，306 题。
#
# 关于文档要求的 reachability 子筛：
#   文档 #30 写"type==Spatial Reasoning 候选；再筛 question 涉及 reachability 的题"，
#   并自注"已查看的 Spatial Reasoning 示例多为相对方位；尚未锁定可达性 ID"。
#   本轮实测确认：数据里基本没有这类题 ——
#     306 题中 301 条是 "What is the spatial relationship between X and Y?" 模板；
#     全量检索 reach/reachab/arm/grasp/able to/can the/within/accessible/feasib，
#     题干命中 0 条，选项命中 2 条（reach）。
#   所以只按 type 筛，不做子筛。若后续拿到可达性 ID 清单，可在此加一层 process_docs。
#
# 同目录下另有全量基线 task：momagraph_bench（1315 题）。

dataset_path: parquet
dataset_kwargs:
  data_files:
    test: lmms_eval/tasks/momagraph_bench/data/train-*.parquet
task: "momagraph_spatial_reasoning"
test_split: test
output_type: generate_until

process_docs: !function utils.process_docs_spatial_reasoning
doc_to_visual: !function utils.doc_to_visual
doc_to_text: !function utils.doc_to_text
doc_to_target: !function utils.doc_to_target

generation_kwargs:
  max_new_tokens: 65536
  temperature: 0
  top_p: 1.0
  num_beams: 1
  do_sample: false

process_results: !function utils.process_results
metric_list:
  - metric: momagraph_accuracy
    aggregation: !function utils.aggregate_results
    higher_is_better: true

lmms_eval_specific_kwargs:
  default:
    pre_prompt: ""
    post_prompt: "\nAnswer with the option's letter from the given choices directly."

metadata:
  version: 0.2
  note: "306 题；type==Spatial Reasoning；对应 P0 #30。未做 reachability 子筛（数据无此类题）"
