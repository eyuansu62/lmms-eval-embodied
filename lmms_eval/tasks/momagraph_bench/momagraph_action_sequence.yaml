# MomaGraph-Bench · Action Sequence
#
# 具身智能 VLM 评测 —— 动作序列与规划。来自 能力体系（CAPABILITIES.md） 的 P0 条目 #29。
# 论文/代码：https://github.com/HybridRobotics/MomaGraph
# 数据：https://huggingface.co/datasets/cheryyunl/MomaGraph-Bench
#
# 筛选：type 以 "Action Reasoning" 开头（含 (overall plan) 等变体），
#       或 type == "Sequence Planning"。合计 343 题。
#
# 关于映射口径：
#   文档 #29 写"发布 type 与 Action Sequence Reasoning 的对应关系待核验；
#   不把 Action Reasoning / Object Selection 整体等同于序列约束"。
#   本轮按已核验的口径取 Action Reasoning + Sequence Planning，
#   **不含 Object Selection**（274 题，留在全量 task 里）。
#
# 纳入的 type 明细：
#   Action Reasoning                     265
#   Sequence Planning                     75
#   Action Reasoning (overall plan)        1
#   Action Reasoning (Scene 1 → Scene 2)   1
#   Action Reasoning (Scene 1 → Scene 3)   1
#   ------------------------------------------
#   合计                                 343
#
# 同目录下另有全量基线 task：momagraph_bench（1315 题）。

dataset_path: parquet
dataset_kwargs:
  data_files:
    test: lmms_eval/tasks/momagraph_bench/data/train-*.parquet
task: "momagraph_action_sequence"
test_split: test
output_type: generate_until

process_docs: !function utils.process_docs_action_sequence
doc_to_visual: !function utils.doc_to_visual
doc_to_text: !function utils.doc_to_text
doc_to_target: !function utils.doc_to_target

generation_kwargs:
  max_new_tokens: 65536
  temperature: 0
  top_p: 1.0
  num_beams: 1
  do_sample: false

process_results: !function utils.process_results
metric_list:
  - metric: momagraph_accuracy
    aggregation: !function utils.aggregate_results
    higher_is_better: true

lmms_eval_specific_kwargs:
  default:
    pre_prompt: ""
    post_prompt: "\nAnswer with the option's letter from the given choices directly."

metadata:
  version: 0.2
  note: "343 题；Action Reasoning(含变体) + Sequence Planning；对应 P0 #29"
