# MomaGraph-Bench
#
# 具身智能 VLM 评测 —— 任务规划与图推理。来自 能力体系（CAPABILITIES.md） 的 P0 优先级条目。
# 论文/代码：https://github.com/HybridRobotics/MomaGraph
# 数据：https://huggingface.co/datasets/cheryyunl/MomaGraph-Bench
#
# 1315 题，图片以 PIL 对象内嵌在 parquet 里，无需额外媒体下载。
#
# 题型分布（type 字段）：
#   Spatial Reasoning     306   空间推理（P0 #5 相对位置 / #6 相对距离）
#   Object Selection      273   物体选择（P0 #10 目标理解）
#   Action Reasoning      265   动作推理（P0 #20 指令顺序理解）
#   Affordance Reasoning  218   可供性推理（P0 #2 客体可供性感知）
#   Effect Prediction     168   效果预测（P0 #21 物理可行性 / #22 约束满足检查）
#   Sequence Planning      75   序列规划（P0 #19 子任务分解）
#   Dynamic Verification    3   动态验证（P0 #24 失败检测）
#   另有 7 个只出现 1 次的罕见 type，一并纳入。
#
# 注意：答案分布偏斜（全量 B 占 49%），且未按序排列（无需打散）。

dataset_path: parquet
dataset_kwargs:
  data_files:
    test: lmms_eval/tasks/momagraph_bench/data/train-*.parquet
task: "momagraph_bench"
test_split: test
output_type: generate_until

doc_to_visual: !function utils.doc_to_visual
doc_to_text: !function utils.doc_to_text
doc_to_target: !function utils.doc_to_target

generation_kwargs:
  max_new_tokens: 65536
  temperature: 0
  top_p: 1.0
  num_beams: 1
  do_sample: false

process_results: !function utils.process_results
metric_list:
  - metric: momagraph_accuracy
    aggregation: !function utils.aggregate_results
    higher_is_better: true

lmms_eval_specific_kwargs:
  default:
    pre_prompt: ""
    post_prompt: "\nAnswer with the option's letter from the given choices directly."

metadata:
  version: 0.1
  note: "1315 题；图片内嵌 parquet；选项在独立 options 字段且自带 A) 前缀"
