# ERIQ · 恢复策略：根据失败原因选择恢复方案
#
# 对应 能力体系（CAPABILITIES.md）能力行：#34 恢复策略
# 切片：QA_MISTAKE_RECOVERY.json · 原始 105 题 -> 采样 50 题
#
# 采样口径见 sampling.py（A 档「切法 A」：每 benchmark 预算 800，
# 8 个子任务按规模等比分配）。单任务 n=50，
# 准确率的 95% 置信半宽约 ±14 个百分点，报数时别把小任务波动当结论。
#
# ⚠️ 真实答案在 conversations 的 gpt 轮，**不是** gt_answer 字段（该字段全空）。
#   图片路径需补 images/ 前缀，已在 utils._resolve_image 里容错处理。

dataset_path: KineMind/ERIQ
dataset_kwargs:
  data_files:
    test: QA_MISTAKE_RECOVERY.json
task: "eriq_mistake_recovery"
test_split: test
include: _default_template_yaml
process_docs: !function sampling.eriq_mistake_recovery_process_docs

metadata:
  version: 0.1
  note: "#34 恢复策略｜原始 105 题，采样 50 题"
