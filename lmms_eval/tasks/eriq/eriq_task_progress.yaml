# ERIQ · 进度估计：任务执行到第几步。⚠️ 原生题只有离散步骤编号，**没有连续百分比**
#
# 对应 能力体系（CAPABILITIES.md）能力行：#32 进度估计
# 切片：QA_TASK_PROGRESS.json · 原始 281 题 -> 采样 69 题
#
# 采样口径见 sampling.py（A 档「切法 A」：每 benchmark 预算 800，
# 8 个子任务按规模等比分配）。单任务 n=69，
# 准确率的 95% 置信半宽约 ±12 个百分点，报数时别把小任务波动当结论。
#
# ⚠️ 真实答案在 conversations 的 gpt 轮，**不是** gt_answer 字段（该字段全空）。
#   图片路径需补 images/ 前缀，已在 utils._resolve_image 里容错处理。

dataset_path: KineMind/ERIQ
dataset_kwargs:
  data_files:
    test: QA_TASK_PROGRESS.json
task: "eriq_task_progress"
test_split: test
include: _default_template_yaml
process_docs: !function sampling.eriq_task_progress_process_docs

metadata:
  version: 0.1
  note: "#32 进度估计｜原始 281 题，采样 69 题"
