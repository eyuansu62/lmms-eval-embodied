# CausalPhys · Anticipation/Collision_Prediction
#
# 碰撞预测（P0 #37 轨迹理解与预测）300 题，当前帧判碰撞的二分类（A/B 各 150）
# 论文：https://arxiv.org/html/2606.05966v1
# 代码：https://github.com/haorentang/CausalPhys
# 数据：https://huggingface.co/datasets/haorentang/causalphys
#
# 媒体按需从 HF 镜像拉取并缓存，不预拉全量。
# 媒体形态的实测记录见 DATA_SHAPE.md。

dataset_path: json
dataset_kwargs:
  data_files:
    test: lmms_eval/tasks/causalphys/data/collision_prediction.jsonl
task: "causalphys_collision_prediction"
test_split: test
output_type: generate_until

doc_to_visual: !function utils.causalphys_collision_prediction_doc_to_visual
doc_to_text: !function utils.doc_to_text
doc_to_target: !function utils.doc_to_target

generation_kwargs:
  max_new_tokens: 65536
  temperature: 0
  top_p: 1.0
  num_beams: 1
  do_sample: false

process_results: !function utils.process_results
metric_list:
  - metric: causalphys_accuracy
    aggregation: !function utils.aggregate_results
    higher_is_better: true

lmms_eval_specific_kwargs:
  default:
    pre_prompt: ""
    post_prompt: "\nAnswer with the option's letter from the given choices directly."

metadata:
  version: 0.2
  note: "300 题，当前帧判碰撞的二分类（A/B 各 150）"
